[package]
name = "silk-chiffon-storage"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Object storage integration for Silk Chiffon"

[features]
default = ["local-bare-paths"]
gcs = ["object_store/gcp"]
local = ["object_store/fs"]
local-bare-paths = ["local"]
s3 = ["object_store/aws"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes = "^1.12.1"
bytesize = "^2.4.2"
clap.workspace = true
futures.workspace = true
glob.workspace = true
humantime.workspace = true
object_store = { workspace = true, features = ["cloud"] }
parking_lot.workspace = true
thiserror.workspace = true
tokio = { version = "^1.53.1", features = ["fs", "rt", "sync"] }
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
bytes = "^1.12.1"
http = "^1.4.0"
http-body-util = "^0.1.3"
hyper = { version = "^1.9.0", features = ["http1", "server"] }
hyper-util = { version = "^0.1.20", features = ["tokio"] }
tempfile = "^3.27.0"
tokio = { version = "^1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
