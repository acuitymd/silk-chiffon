[package]
name = "silk-chiffon-input-bigquery"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "BigQuery Storage Read input for Silk Chiffon"

[features]
integration-test-support = []

[dependencies]
anyhow.workspace = true
arrow = { workspace = true, features = ["ipc_compression", "pool"] }
arrow-buffer = { version = "^59.3.3", features = ["pool"] }
chrono = "^0.4.45"
clap.workspace = true
datafusion = { workspace = true, features = ["default"] }
futures.workspace = true
google-cloud-auth = { version = "=1.19.0", default-features = false }
http = "^1.5.0"
humantime.workspace = true
hyper = { version = "^1.12.0", default-features = false, features = ["client", "http1", "http2"] }
# no default features: they include `safe-encode` and `safe-decode`, which would
# also switch arrow-ipc and parquet to the slower implementation they opted out of
lz4_flex = { version = "^0.14.2", default-features = false, features = ["frame", "std"] }
percent-encoding = "^2.3.2"
prost = "^0.14.6"
prost-types = "^0.14.6"
rand = "^0.10.4"
reqwest = { version = "^0.13.5", default-features = false, features = ["http2", "rustls-no-provider"] }
rustls = { version = "^0.23.46", default-features = false, features = ["ring"] }
sha2 = { version = "^0.11.1", default-features = false }
silk-chiffon-core = { path = "../silk-chiffon-core" }
thiserror.workspace = true
tokio = { version = "^1.54.1", features = ["rt", "sync", "time"] }
tonic = { version = "^0.14.9", features = ["tls-webpki-roots", "transport"] }
tonic-prost = "^0.14.9"
tracing = "^0.1.44"
unicode-general-category = "^1.1.0"
url.workspace = true

[build-dependencies]
prost-build = "^0.14.6"
protoc-bin-vendored = "^3.3.0"
tonic-prost-build = "^0.14.9"

[dev-dependencies]
axum = "^0.8.9"
parquet = { version = "^59.3.3", features = ["arrow"] }
serde_json.workspace = true
silk-chiffon-test-support = { path = "../silk-chiffon-test-support" }
tempfile = "^3.27.0"
tokio = { version = "^1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
