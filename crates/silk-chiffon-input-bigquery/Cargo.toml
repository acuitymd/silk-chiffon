[package]
name = "silk-chiffon-input-bigquery"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "BigQuery Storage Read input for Silk Chiffon"

[features]
integration-test-support = []

[dependencies]
anyhow.workspace = true
arrow = { workspace = true, features = ["ipc_compression", "pool"] }
arrow-buffer = { version = "^58.4.0", features = ["pool"] }
chrono = "^0.4.45"
clap.workspace = true
datafusion = { workspace = true, features = ["default"] }
futures.workspace = true
google-cloud-auth = { version = "=1.14.0", default-features = false }
http = "^1.4.2"
humantime.workspace = true
hyper = { version = "^1.9.0", default-features = false, features = ["client", "http1", "http2"] }
lz4_flex = "^0.13.1"
percent-encoding = "^2.3.2"
prost = "^0.14.4"
prost-types = "^0.14.4"
rand = "^0.10.2"
reqwest = { version = "^0.12.28", default-features = false, features = ["http2", "rustls-tls-native-roots"] }
rustls = { version = "^0.23.42", default-features = false, features = ["ring"] }
sha2 = { version = "^0.11.0", default-features = false }
silk-chiffon-core = { path = "../silk-chiffon-core" }
thiserror.workspace = true
tokio = { version = "^1.53.1", features = ["rt", "sync", "time"] }
tonic = { version = "^0.14.6", features = ["tls-webpki-roots", "transport"] }
tonic-prost = "^0.14.6"
tracing = "^0.1.44"
unicode-general-category = "^1.1.0"
url.workspace = true

[build-dependencies]
prost-build = "^0.14.4"
protoc-bin-vendored = "^3.2.0"
tonic-prost-build = "^0.14.6"

[dev-dependencies]
axum = "^0.8.9"
parquet = { version = "^58.4.0", features = ["arrow"] }
serde_json.workspace = true
silk-chiffon-test-support = { path = "../silk-chiffon-test-support" }
tempfile = "^3.27.0"
tokio = { version = "^1.53.1", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
