[workspace]
members = [
  "crates/silk-chiffon-core",
  "crates/silk-chiffon-format-arrow",
  "crates/silk-chiffon-format-parquet",
  "crates/silk-chiffon-format-vortex",
  "crates/silk-chiffon-input-bigquery",
  "crates/silk-chiffon-inspection-output",
  "crates/silk-chiffon-storage",
  "crates/silk-chiffon-test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Cora Sutton <cora@sutton.me>"]
categories = ["command line utilities", "data processing", "columnar data"]
edition = "2024"
license = "MIT"
repository = "https://github.com/acuitymd/silk-chiffon"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "^1.0.104"
arrow = { version = "^59.3.3", features = ["default"] }
async-trait = "^0.1.92"
clap = { version = "^4.6.8", features = ["default", "derive"] }
datafusion = { version = "^55.3.0", default-features = false }
futures = "^0.3.34"
glob = "^0.3.4"
humantime = "^2.4.0"
object_store = { version = "^0.13.2", default-features = false }
parking_lot = "^0.13.0"
serde_json = "^1.0.154"
thiserror = "^2.0.21"
tokio-util = { version = "^0.7.20", features = ["rt"] }
url = "^2.5.8"

[package]
name = "silk_chiffon"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Silky smooth conversion between columnar data formats 💝"

[[bin]]
name = "silk-chiffon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arrow = { workspace = true, features = ["ipc_compression"] }
bytesize = "^2.7.0"
camino = { version = "^1.2.6", features = ["serde1"] }
clap.workspace = true
clap-markdown = { version = "^0.1.5", optional = true }
clap_complete = "^4.6.12"
datafusion = { workspace = true, features = ["array_expressions", "default"] }
futures.workspace = true
lru = "^0.19.0"
mimalloc = "^0.1.52"
owo-colors = "^4.4.0"
percent-encoding = "^2.3.2"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json.workspace = true
silk-chiffon-core = { path = "crates/silk-chiffon-core" }
silk-chiffon-format-arrow = { path = "crates/silk-chiffon-format-arrow" }
silk-chiffon-format-parquet = { path = "crates/silk-chiffon-format-parquet" }
silk-chiffon-format-vortex = { path = "crates/silk-chiffon-format-vortex" }
silk-chiffon-input-bigquery = { path = "crates/silk-chiffon-input-bigquery", optional = true }
silk-chiffon-inspection-output = { path = "crates/silk-chiffon-inspection-output" }
silk-chiffon-storage = { path = "crates/silk-chiffon-storage", default-features = false }
strum_macros = "^0.28.0"
sysinfo = "^0.40.4"
tabled = { version = "^0.22.0", features = ["ansi"] }
thiserror.workspace = true
tokio = { version = "^1.54.1", features = ["rt-multi-thread", "macros", "io-util", "fs", "sync"] }
url.workspace = true

[build-dependencies]
chrono = "^0.4.45"
chrono-tz = "^0.10.4"

[features]
default = ["local-bare-paths", "gcs", "s3", "bigquery"]
bigquery = ["dep:silk-chiffon-input-bigquery"]
bigquery-integration-tests = ["bigquery", "local-bare-paths", "silk-chiffon-input-bigquery/integration-test-support"]
gcs = ["silk-chiffon-storage/gcs"]
local = ["silk-chiffon-storage/local"]
local-bare-paths = ["local", "silk-chiffon-storage/local-bare-paths"]
s3 = ["silk-chiffon-storage/s3"]
# generates docs/CLI.md from the clap definitions; kept optional so clap-markdown
# stays out of the release binary. Run `just docs` (or `just verify`).
docs = ["dep:clap-markdown"]

[dev-dependencies]
assert_cmd = "^2.2.2"
async-trait.workspace = true
axum = "^0.8.9"
bytes = "^1.12.2"
criterion = { version = "^0.8.2", features = ["html_reports"] }
http = "^1.5.0"
humantime.workspace = true
object_store.workspace = true
parquet = { version = "^59.3.3", features = ["default", "async", "json", "arrow_canonical_extension_types"] }
predicates = "^3.1.4"
prost = "^0.14.6"
prost-types = "^0.14.6"
rand = "^0.10.4"
silk-chiffon-test-support = { path = "crates/silk-chiffon-test-support" }
tempfile = "^3.27.0"
tonic = { version = "^0.14.9", features = ["router"] }
tonic-prost = "^0.14.9"

[[bench]]
name = "partitioning"
harness = false

[[test]]
name = "bigquery_transform_integration"
required-features = ["bigquery-integration-tests"]

[[test]]
name = "cloud_live_soak"
required-features = ["bigquery", "gcs", "s3"]

[[example]]
name = "gen-docs"
required-features = ["docs"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev] # faster dev builds
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2 # optimize deps, not your code

[profile.profiling]
inherits = "release"
debug = true

# NOTE: native profile requires RUSTFLAGS="-C target-cpu=native"
# use `just build-native` which sets this automatically
[profile.native]
inherits = "release"

[workspace.lints.clippy]
case_sensitive_file_extension_comparisons = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
clone_on_ref_ptr = "warn"
needless_pass_by_value = "warn"
option_as_ref_cloned = "warn"
similar_names = "warn"

[lints]
workspace = true
