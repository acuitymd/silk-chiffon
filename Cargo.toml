[workspace]
members = [
  "crates/silk-chiffon-core",
  "crates/silk-chiffon-format-arrow",
  "crates/silk-chiffon-format-parquet",
  "crates/silk-chiffon-format-vortex",
  "crates/silk-chiffon-inspection-output",
  "crates/silk-chiffon-storage",
  "crates/silk-chiffon-test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Cora Sutton <cora@sutton.me>"]
categories = ["command line utilities", "data processing", "columnar data"]
edition = "2024"
homepage = "https://github.com/acuitymd/silk-chiffon"
license = "MIT"
repository = "https://github.com/acuitymd/silk-chiffon"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "^1.0.104"
arrow = { version = "^58.4.0", features = ["default"] }
async-trait = "^0.1.91"
clap = { version = "^4.6.4", features = ["default", "derive"] }
datafusion = { version = "^54.1.0", default-features = false }
futures = "^0.3.33"
glob = "^0.3.4"
humantime = "^2.4.0"
object_store = { version = "^0.13.2", default-features = false }
parking_lot = "^0.12.5"
serde_json = "^1.0.151"
thiserror = "^2.0.19"
tokio-util = { version = "^0.7.19", features = ["rt"] }
url = "^2.5.8"

[package]
name = "silk_chiffon"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Silky smooth conversion between columnar data formats 💝"

[[bin]]
name = "silk-chiffon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arrow = { workspace = true, features = ["ipc_compression"] }
async-trait.workspace = true
bytes = "^1.12.1"
bytesize = "^2.4.2"
camino = { version = "^1.2.4", features = ["serde1"] }
clap.workspace = true
clap-markdown = { version = "^0.1.5", optional = true }
clap_complete = "^4.6.7"
datafusion = { workspace = true, features = ["array_expressions", "default"] }
datafusion-datasource = "=54.1.0"
futures.workspace = true
humansize = "^2.1.3"
lru = "^0.18.1"
mimalloc = "^0.1.52"
minijinja = "^2.21.0"
object_store.workspace = true
owo-colors = "^4.3.0"
parking_lot.workspace = true
percent-encoding = "^2.3.2"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json.workspace = true
silk-chiffon-core = { path = "crates/silk-chiffon-core" }
silk-chiffon-format-arrow = { path = "crates/silk-chiffon-format-arrow" }
silk-chiffon-format-parquet = { path = "crates/silk-chiffon-format-parquet" }
silk-chiffon-format-vortex = { path = "crates/silk-chiffon-format-vortex" }
silk-chiffon-inspection-output = { path = "crates/silk-chiffon-inspection-output" }
silk-chiffon-storage = { path = "crates/silk-chiffon-storage", default-features = false }
strum_macros = "^0.28.0"
sysinfo = "^0.39.6"
tabled = { version = "^0.21.0", features = ["ansi"] }
tempfile = "^3.27.0"
thiserror.workspace = true
tokio = { version = "^1.53.1", features = ["rt-multi-thread", "macros", "io-util", "fs", "sync"] }
tokio-util.workspace = true
url.workspace = true
uuid = { version = "^1.24.0", features = ["v4"] }

[build-dependencies]
chrono = "^0.4.45"
chrono-tz = "^0.10.4"

[features]
default = ["local-bare-paths"]
local = ["silk-chiffon-storage/local"]
local-bare-paths = ["local", "silk-chiffon-storage/local-bare-paths"]
# generates docs/CLI.md from the clap definitions; kept optional so clap-markdown
# stays out of the release binary. Run `just docs` (or `just verify`).
docs = ["dep:clap-markdown"]

[dev-dependencies]
assert_cmd = "^2.2.2"
criterion = { version = "^0.8.2", features = ["html_reports"] }
parquet = { version = "^58.4.0", features = ["default", "async", "json", "arrow_canonical_extension_types"] }
predicates = "^3.1.4"
rand = "^0.10.2"
silk-chiffon-test-support = { path = "crates/silk-chiffon-test-support" }

[[bench]]
name = "partitioning"
harness = false

[[example]]
name = "gen-docs"
required-features = ["docs"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev] # faster dev builds
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2 # optimize deps, not your code

[profile.profiling]
inherits = "release"
debug = true

# NOTE: native profile requires RUSTFLAGS="-C target-cpu=native"
# use `just build-native` which sets this automatically
[profile.native]
inherits = "release"

[workspace.lints.clippy]
case_sensitive_file_extension_comparisons = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
clone_on_ref_ptr = "warn"
needless_pass_by_value = "warn"
option_as_ref_cloned = "warn"
similar_names = "warn"

[lints]
workspace = true
